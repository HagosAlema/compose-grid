name: Release

# Publishing to Maven Central is irreversible, so this never runs on a plain
# push. It fires only on an explicit `v*` tag, or a manual dispatch — see
# docs/RELEASING.md for the full checklist, including the groupId decision that has
# to be settled before the first publish can succeed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Never publish something that doesn't build and pass tests: a bad
      # release cannot be withdrawn from Maven Central, only superseded.
      - name: Unit tests
        run: ./gradlew test

      - name: Assemble
        run: ./gradlew assemble

      # Fail fast, and locally, if signing is misconfigured. Publishing to a
      # local repository exercises the exact same signing path as the real
      # publish, so a malformed key or wrong passphrase surfaces here with a
      # clear error instead of as an opaque failure mid-upload. Also proves the
      # key reached the runner at all.
      - name: Verify signing works
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal --stacktrace
          signatures=$(find ~/.m2/repository/io/github/hagosalema -name '*.asc' | wc -l)
          echo "Signature files produced: $signatures"
          if [ "$signatures" -eq 0 ]; then
            echo "::error::No .asc files were produced, so the signing key was not picked up." \
                 "Check that SIGNING_IN_MEMORY_KEY holds the ASCII-armored block verbatim" \
                 "(-----BEGIN PGP PRIVATE KEY BLOCK----- through -----END-----), not a base64 wrapping of it."
            exit 1
          fi

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        # Deliberately no signingInMemoryKeyId here. A missing GitHub secret
        # expands to an empty string rather than being omitted, and Gradle then
        # sees the property as present-but-blank — the signing plugin tries to
        # parse "" as a key id and fails with "The key ID must be in a valid
        # form". Only add it if the keyring really holds several secret keys.
        # --stacktrace because the default output for a failed upload is a
        # single opaque line; without it there's nothing to diagnose from.
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Build API documentation
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-${{ github.ref_name }}
          path: build/dokka/html
