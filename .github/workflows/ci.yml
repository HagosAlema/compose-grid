name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble
        run: ./gradlew assemble

  instrumented-tests:
    # Ubuntu, not macOS. The macOS runners are Apple Silicon now, and the
    # emulator action defaults to x86_64 system images that don't exist for an
    # ARM host — the AVD failed to start in ~30s, well before any test ran.
    # GitHub's Ubuntu runners support nested virtualisation, so enabling KVM
    # below gives hardware acceleration here, at a fraction of the macOS
    # per-minute cost.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Without this the emulator falls back to software rendering and either
      # times out or crawls. Taken from the emulator action's own README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          # Only the library modules have instrumented tests. `connectedCheck`
          # at the root would also try to run the benchmark module, which needs
          # a physical device to produce meaningful numbers.
          script: ./gradlew :grid-core:connectedDebugAndroidTest

  api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Building the docs on every PR keeps malformed KDoc from being
      # discovered at release time, when it blocks a publish.
      - name: Build API documentation
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build/dokka/html
