# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# AGP 9+ compiles Kotlin sources itself without a separate kotlin-android
# plugin. This is the default (true) as of AGP 9.0 — listed explicitly here
# for clarity, not because it needs to be set.
android.builtInKotlin=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Dokka 2.x ships both plugin generations in one artifact and defaults to the
# deprecated V1. The aggregation API the root build uses (the `dokka(project)`
# dependency configuration and the `dokka { }` extension) only exists in V2.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
